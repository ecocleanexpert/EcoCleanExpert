function compressImage(file, maxWidth = 1400, quality = 0.78) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) { reject(new Error("Format non supporté")); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let { width, height } = img;
        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " o";
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " Ko";
  return (bytes / (1024 * 1024)).toFixed(1) + " Mo";
}

function dataUrlSize(dataUrl) {
  if (!dataUrl || !dataUrl.startsWith("data:")) return 0;
  return Math.round((dataUrl.length - dataUrl.indexOf(",") - 1) * 0.75);
}

function Img({ src, alt, className = "", ...rest }) {
  const [err, setErr] = useState(false);
  if (err || !src) {
    return (
      <div className={`${className} bg-gradient-to-br from-slate-200 via-slate-100 to-slate-300 flex items-center justify-center`}>
        <span className="text-[10px] uppercase tracking-widest text-slate-400 px-2 text-center leading-tight">{alt || "Photo à fournir"}</span>
      </div>
    );
  }
  return <img src={src} alt={alt} loading="lazy" decoding="async" className={className} onError={() => setErr(true)} {...rest} />;
}

function useReveal(threshold = 0.15) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    if (typeof IntersectionObserver === "undefined") { setShown(true); return; }
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setShown(true); obs.disconnect(); } }, { threshold });
    obs.observe(el); return () => obs.disconnect();
  }, [threshold]);
  return [ref, shown];
}

function Reveal({ children, delay = 0, className = "" }) {
  const [ref, shown] = useReveal();
  return (
    <div ref={ref} className={className} style={{
      opacity: shown ? 1 : 0,
      transform: shown ? "translateY(0)" : "translateY(22px)",
      transition: `opacity .7s cubic-bezier(.2,.7,.2,1) ${delay}ms, transform .7s cubic-bezier(.2,.7,.2,1) ${delay}ms`,
    }}>{children}</div>
  );
}

/* Compteur animé — s'active quand la section entre dans le viewport */
function AnimatedNumber({ value, suffix = "", duration = 1800 }) {
  const n = Number(String(value).replace(/\s/g, "").replace(",", "."));
  const numeric = !isNaN(n) && isFinite(n) && String(value).trim() !== "";
  const [display, setDisplay] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);

  useEffect(() => {
    if (!numeric) return;
    const el = ref.current; if (!el) return;
    if (typeof IntersectionObserver === "undefined") { setDisplay(n); return; }
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !started.current) {
        started.current = true;
        const t0 = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - t0) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          setDisplay(Math.round(n * eased));
          if (t < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    }, { threshold: 0.3 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [n, numeric, duration]);

  if (!numeric) return <span>{value}{suffix}</span>;
  return <span ref={ref}>{display.toLocaleString("fr-FR")}{suffix}</span>;
}

function ImageUploader({ value, onChange, label, hint, aspect = "aspect-square" }) {
  const inputRef = useRef(null);
  const [drag, setDrag] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  const handleFile = async (file) => {
    setErr("");
    if (!file) return;
    if (!file.type.startsWith("image/")) { setErr("Format non supporté (JPG, PNG, WebP)"); return; }
    setLoading(true);
    try {
      const dataUrl = await compressImage(file);
      onChange(dataUrl, file.name);
    } catch (e) { setErr("Erreur de chargement"); }
    setLoading(false);
  };

  return (
    <div>
      {label && <label className="text-[12.5px] font-semibold text-slate-700 block mb-1.5">{label}</label>}
      <div
        onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={(e) => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }}
        onClick={() => inputRef.current?.click()}
        className={`relative cursor-pointer rounded-xl border-2 border-dashed transition-all overflow-hidden ${
          drag ? "border-[#5CC63D] bg-[#5CC63D]/5" : "border-slate-200 hover:border-[#1E9BE0] hover:bg-slate-50"
        }`}
      >
        <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={(e) => { handleFile(e.target.files[0]); e.target.value = ""; }} />
        {value ? (
          <div className={`relative ${aspect}`}>
            <img src={value} alt="Aperçu" className="w-full h-full object-cover" />
            <div className="absolute inset-0 bg-slate-900/0 hover:bg-slate-900/40 transition-colors flex items-center justify-center opacity-0 hover:opacity-100">
              <span className="text-white text-[12px] font-semibold bg-slate-900/70 px-3 py-1.5 rounded-full">Cliquer pour remplacer</span>
            </div>
            <button type="button" onClick={(e) => { e.stopPropagation(); onChange("", ""); }}
              className="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/95 hover:bg-white text-red-500 shadow-md flex items-center justify-center transition-colors" aria-label="Supprimer">
              {I.trash("w-4 h-4")}
            </button>
          </div>
        ) : (
          <div className={`${aspect} flex flex-col items-center justify-center text-center p-4`}>
            {loading ? (
              <div className="w-8 h-8 border-2 border-[#1E9BE0] border-t-transparent rounded-full spin" />
            ) : (
              <>
                <div className="w-12 h-12 rounded-xl bg-slate-100 text-slate-400 flex items-center justify-center mb-3">{I.upload("w-6 h-6")}</div>
                <p className="text-[13px] font-semibold text-slate-700">Glisser ou cliquer</p>
                <p className="text-[11px] text-slate-400 mt-1">{hint || "JPG, PNG, WebP"}</p>
              </>
            )}
          </div>
        )}
      </div>
      {err && <p className="text-[12px] text-red-600 mt-1.5">{err}</p>}
    </div>
  );
}

        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <h3 className="text-[16px] font-bold text-slate-900">Choisir une image</h3>
          <button onClick={onClose} className="w-9 h-9 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-500">{I.x("w-5 h-5")}</button>
        </div>
        <div className="p-6 overflow-y-auto">

            <div className="text-center py-12 text-slate-400">

              <p className="text-[14px]">Aucune image dans la médiathèque.</p>
              <p className="text-[12px] mt-1">Téléversez d'abord des images depuis l'onglet Médiathèque.</p>
            </div>
          ) : (
            <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">

                <button key={m.id} onClick={() => { onPick(m.dataUrl); onClose(); }}

    </div>
  );
}

function Btn({ variant = "primary", size = "md", icon, children, ...rest }) {
  const variants = {
    primary: "bg-[#0A2A6B] hover:bg-[#071B4C] text-white",
    green: "bg-[#5CC63D] hover:bg-[#4CAF50] text-white",
    ghost: "bg-slate-100 hover:bg-slate-200 text-slate-700",
    danger: "bg-red-50 hover:bg-red-100 text-red-600",
    outline: "bg-white border border-slate-200 hover:border-slate-300 text-slate-700",
  };
  const sizes = { sm: "px-3 py-1.5 text-[12.5px]", md: "px-4 py-2.5 text-[13.5px]", lg: "px-5 py-3 text-[14px]" };
  return (
    <button className={`inline-flex items-center gap-2 font-semibold rounded-xl transition-colors ${variants[variant]} ${sizes[size]}`} {...rest}>
      {icon}{children}
    </button>
  );
}

}
function NumberField({ label, value, onChange, min = 0, max = 99999, step = 1, hint, recommended }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-1.5">
        <label className="text-[12.5px] font-semibold text-slate-700">{label}</label>
        {recommended && (
          <span className="text-[10.5px] text-slate-400">
            reco : <button type="button" onClick={() => onChange(Number(recommended))} className="text-[#1E9BE0] hover:underline font-semibold">{recommended}</button>
          </span>
        )}
      </div>
      <div className="relative">
        <input
          type="number"
          value={value}
          min={min}
          max={max}
          step={step}
          onChange={(e) => {
            const v = e.target.value === "" ? "" : Number(e.target.value);
            if (v === "" || (!isNaN(v) && v >= min && v <= max)) onChange(v);
          }}
          className="w-full px-3.5 py-2.5 pr-12 rounded-xl border border-slate-200 focus:border-[#1E9BE0] focus:ring-2 focus:ring-[#1E9BE0]/10 outline-none text-[14px] bg-white font-semibold"
        />
        <span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-[11px] font-bold text-slate-400">ms</span>
      </div>
      {hint && <p className="mt-1 text-[11px] text-slate-400">{hint}</p>}
    </div>
  );
}

function TextArea({ label, value, onChange, placeholder, rows = 3 }) {
  return (
    <div>
      {label && <label className="text-[12.5px] font-semibold text-slate-700 block mb-1.5">{label}</label>}
      <textarea value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} rows={rows}
        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-[#1E9BE0] focus:ring-2 focus:ring-[#1E9BE0]/10 outline-none text-[14px] bg-white resize-y" />
    </div>
  );
}

function Toggle({ checked, onChange, label }) {
  return (
    <label className="inline-flex items-center gap-2.5 cursor-pointer select-none">
      <button type="button" onClick={() => onChange(!checked)}
        className={`relative w-10 rounded-full transition-colors ${checked ? "bg-[#5CC63D]" : "bg-slate-300"}`} style={{ height: 22 }}>
        <span className={`absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform ${checked ? "left-[22px]" : "left-0.5"}`} style={{ height: 18, width: 18 }} />
      </button>
      {label && <span className="text-[13.5px] text-slate-700">{label}</span>}
    </label>
  );
}

function Toast({ message, type = "success", onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 2600); return () => clearTimeout(t); }, [onClose]);
  const colors = { success: "bg-[#5CC63D]", error: "bg-red-500", info: "bg-[#1E9BE0]" };
  return (
    <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] ${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg text-[13.5px] font-medium flex items-center gap-3`}>
      {type === "success" ? I.check("w-4 h-4") : I.info("w-4 h-4")}
      {message}
    </div>
  );
}

function Confirm({ open, title, message, onConfirm, onCancel }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-[70] flex items-center justify-center p-5">
      <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={onCancel} />
      <div className="relative bg-white rounded-2xl ring-1 ring-slate-900/5 shadow-2xl w-full max-w-md p-6">
        <h3 className="text-[16px] font-bold text-slate-900">{title}</h3>
        <p className="text-[13.5px] text-slate-600 mt-2">{message}</p>
        <div className="mt-5 flex justify-end gap-2">
          <Btn variant="ghost" onClick={onCancel}>Annuler</Btn>
          <Btn variant="danger" onClick={onConfirm}>Supprimer</Btn>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   HERO — Image plein écran + panneau + typewriter
============================================================ */
function TypewriterHero({ phrases, settings }) {
  const [idx, setIdx] = useState(0);
  const [line1, setLine1] = useState("");
  const [line2, setLine2] = useState("");
  const [phase, setPhase] = useState("typing1");

  // Valeurs paramétrables depuis l'admin (avec fallback par défaut)
  const typingSpeed = Number(settings?.typingSpeed) || 35;
  const erasingSpeed = Number(settings?.erasingSpeed) || 15;
  const pauseBetweenLines = Number(settings?.pauseBetweenLines) || 100;
  const holdDuration = Number(settings?.holdDuration) || 3000;
  const pauseBeforeErasing = Number(settings?.pauseBeforeErasing) || 200;

  useEffect(() => {
    const current = phrases[idx];
    let timer;

    if (phase === "typing1") {
      if (line1.length < current.line1.length) {
        timer = setTimeout(() => setLine1(current.line1.slice(0, line1.length + 1)), typingSpeed);
      } else {
        timer = setTimeout(() => setPhase("typing2"), pauseBetweenLines);
      }
    } else if (phase === "typing2") {
      if (line2.length < current.line2.length) {
        timer = setTimeout(() => setLine2(current.line2.slice(0, line2.length + 1)), typingSpeed);
      } else {
        timer = setTimeout(() => setPhase("holding"), holdDuration);
      }
    } else if (phase === "holding") {
      timer = setTimeout(() => setPhase("erasing"), pauseBeforeErasing);
    } else if (phase === "erasing") {
      if (line2.length > 0) {
        timer = setTimeout(() => setLine2(line2.slice(0, -1)), erasingSpeed);
      } else if (line1.length > 0) {
        timer = setTimeout(() => setLine1(line1.slice(0, -1)), erasingSpeed);
      } else {
        setIdx((idx + 1) % phrases.length);
        setPhase("typing1");
      }
    }
    return () => clearTimeout(timer);
  }, [line1, line2, phase, idx, phrases, typingSpeed, erasingSpeed, pauseBetweenLines, holdDuration, pauseBeforeErasing]);

  const cursorOnLine1 = !line2;

  return (
    <h1 className="mt-3 text-[36px] leading-[1.02] sm:text-[44px] lg:text-[52px] font-extrabold tracking-[-0.03em] text-[#0A2A6B] min-h-[76px] sm:min-h-[92px] lg:min-h-[108px]">
      <span>
        {line1}
        {cursorOnLine1 && (
          <span className="cursor-blink inline-block w-[3px] h-[0.85em] bg-[#1E9BE0] ml-1 align-middle rounded-sm" />
        )}
      </span>
      <br />
      <span className="text-[#1E9BE0]">
        {line2}
        {!cursorOnLine1 && (
          <span className="cursor-blink inline-block w-[3px] h-[0.85em] bg-[#1E9BE0] ml-1 align-middle rounded-sm" />
        )}
      </span>
    </h1>
  );
}

/* ============================================================
   COMPARE
============================================================ */
function Compare({ before, after, title }) {
  const [pos, setPos] = useState(50);
  const ref = useRef(null);
  const dragging = useRef(false);
  const update = useCallback((clientX) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    setPos(Math.min(100, Math.max(0, ((clientX - r.left) / r.width) * 100)));
  }, []);
  useEffect(() => {
    const move = (e) => { if (dragging.current) update(e.clientX); };
    const up = () => { dragging.current = false; };
    window.addEventListener("pointermove", move, { passive: true });
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
    return () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up); };
  }, [update]);
  return (
    <div ref={ref} role="slider" aria-label={`Comparaison — ${title}`} aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(pos)} tabIndex={0}
      onKeyDown={(e) => { if (e.key === "ArrowLeft") setPos((p) => Math.max(0, p - 4)); if (e.key === "ArrowRight") setPos((p) => Math.min(100, p + 4)); }}
      onPointerDown={(e) => { dragging.current = true; update(e.clientX); }}
      className="relative w-full aspect-[16/10] rounded-2xl overflow-hidden select-none touch-none cursor-ew-resize ring-1 ring-slate-900/10 outline-none focus-visible:ring-2 focus-visible:ring-[#5CC63D]">
      <Img src={after} alt={`Après — ${title}`} className="absolute inset-0 w-full h-full object-cover" />
      <div className="absolute inset-0" style={{ clipPath: `inset(0 ${100 - pos}% 0 0)` }}>
        <Img src={before} alt={`Avant — ${title}`} className="absolute inset-0 w-full h-full object-cover" />
      </div>
      <span className="absolute top-3 left-3 px-3 py-1.5 rounded-full bg-slate-900/80 backdrop-blur text-white text-[11px] font-bold tracking-wide uppercase">Avant</span>
      <span className="absolute top-3 right-3 px-3 py-1.5 rounded-full bg-[#5CC63D] text-white text-[11px] font-bold tracking-wide uppercase">Après</span>
      <div className="absolute top-0 bottom-0 w-0.5 bg-white shadow-[0_0_0_1px_rgba(15,23,42,0.15)]" style={{ left: `${pos}%` }}>
        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white shadow-lg ring-1 ring-slate-900/10 flex items-center justify-center">
          <svg viewBox="0 0 24 24" className="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 6-4 6 4 6M15 6l4 6-4 6" /></svg>
        </div>
      </div>
    </div>
  );
}

    validateField(k, form[k]);
  };

  const validateField = (k, v) => {
    let err = "";
    const val = String(v || "").trim();
    if (k === "name" && val.length < 2) err = "Indiquez votre nom complet.";
    if (k === "phone") {
      const digits = val.replace(/[^0-9]/g, "");
      if (digits.length < 8) err = "Numéro invalide (au moins 8 chiffres).";
    }
    if (k === "service" && !val) err = "Choisissez un service.";
    if (k === "commune" && !val) err = "Choisissez votre commune.";
    if (k === "message" && val.length > 600) err = "Message trop long (600 caractères max).";
    setErrors((e) => ({ ...e, [k]: err }));
    return !err;
  };

  const validateAll = () => {
    const required = ["name", "phone", "service", "commune"];
    const newErrors = {};
    let ok = true;
    required.forEach((k) => {
      const valid = validateField(k, form[k]);
      if (!valid) ok = false;
      newErrors[k] = errors[k];
    });
    setTouched({ name: true, phone: true, service: true, commune: true, message: true });
    return ok;
  };

  const buildMessage = () => {
    const lines = [
      "Bonjour Eco Clean Expert, je souhaite un devis.",
      "",
      `Nom : ${form.name.trim()}`,
      `Téléphone : ${form.phone.trim()}`,
    ];
    if (form.email.trim()) lines.push(`Email : ${form.email.trim()}`);
    lines.push(`Service : ${form.service}`);
    lines.push(`Commune : ${form.commune}`);
    if (form.message.trim()) lines.push("", `Message : ${form.message.trim()}`);
    return lines.join("\n");
  };

  const submit = (e) => {
    e.preventDefault();
    if (!validateAll()) return;
    setSubmitting(true);

    const request = {
      id: Date.now(),
      name: form.name.trim(),
      phone: form.phone.trim(),
      email: form.email.trim(),
      service: form.service,
      commune: form.commune,
      message: form.message.trim(),
      date: new Date().toISOString(),
      status: "Nouveau",
    };

    // Enregistrement local pour l'admin
    if (onNewRequest) onNewRequest(request);

    // Ouverture WhatsApp
    const url = waLink(buildMessage());
    window.open(url, "_blank");

    setSubmitting(false);
    setSubmitted(true);
  };

  const reset = () => {
    setForm({ name: "", phone: "", email: "", service: "", commune: "", message: "" });
    setErrors({});
    setTouched({});
    setSubmitted(false);
  };

  if (submitted) {
    return (
      <section id="devis" className="py-16 lg:py-24">
        <div className="max-w-2xl mx-auto px-5 lg:px-8">
          <Reveal>

              <p className="mt-3 text-[15px] text-slate-600 max-w-md mx-auto leading-relaxed">
                {cf.successText || "Nous vous répondons en moins d'une heure sur WhatsApp."}
              </p>
              <div className="mt-7 flex flex-col sm:flex-row gap-3 justify-center">
                <a href={waLink()} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center gap-2.5 bg-[#5CC63D] hover:bg-[#4CAF50] text-white font-semibold px-6 py-3.5 rounded-full transition-colors">
                  {I.wa("w-5 h-5")} Ouvrir WhatsApp
                </a>
                <a href={`tel:${content.contact.phone.replace(/\s/g, "")}`} className="inline-flex items-center justify-center gap-2.5 bg-white border border-slate-200 hover:border-slate-300 text-slate-800 font-semibold px-6 py-3.5 rounded-full transition-colors">
                  {I.phone("w-5 h-5")} Appeler
                </a>
              </div>
              <button onClick={reset} className="mt-6 text-[13px] text-slate-500 hover:text-slate-700 underline">
                Envoyer une nouvelle demande
              </button>
            </div>
          </Reveal>
        </div>

    );

  const inputBase = "w-full px-4 py-3 rounded-xl border bg-white outline-none text-[14px] transition-colors";
  const inputOk = "border-slate-200 focus:border-[#1E9BE0] focus:ring-2 focus:ring-[#1E9BE0]/10";

function AdminRequests({ requests, setRequests, onToast }) {
  const [filter, setFilter] = useState("all");

  const [selected, setSelected] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  const statuses = ["Nouveau", "En cours", "Traité", "Annulé"];

  const filtered = requests.filter((r) => {
    if (filter !== "all" && r.status !== filter) return false;
    if (search) {
      const s = search.toLowerCase();
      return (
        r.name.toLowerCase().includes(s) ||
        r.phone.includes(s) ||
        (r.service || "").toLowerCase().includes(s) ||
        (r.commune || "").toLowerCase().includes(s)
      );
    }
    return true;
  });

  const updateStatus = (id, status) => {
    setRequests((rs) => rs.map((r) => (r.id === id ? { ...r, status } : r)));
    onToast("Statut mis à jour");
  };

  const remove = (id) => {
    setRequests((rs) => rs.filter((r) => r.id !== id));
    onToast("Demande supprimée");
    setConfirmDel(null);
    if (selected?.id === id) setSelected(null);
  };

  const formatDate = (iso) => {
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return "À l'instant";
      if (diff < 3600) return `Il y a ${Math.floor(diff / 60)} min`;
      if (diff < 86400) return `Il y a ${Math.floor(diff / 3600)} h`;
      if (diff < 604800) return `Il y a ${Math.floor(diff / 86400)} j`;
      return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
    } catch { return "—"; }
  };

  const statusColor = (s) => {
    if (s === "Nouveau") return "bg-[#5CC63D]/10 text-[#4CAF50]";
    if (s === "En cours") return "bg-[#F59E0B]/10 text-[#B45309]";
    if (s === "Traité") return "bg-slate-100 text-slate-500";
    return "bg-red-50 text-red-500";
  };

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between gap-4 flex-wrap">

/* ============================================================
   ADMIN STATISTIQUES

function AdminStats({ content, setContent, onToast }) {
  const stats = content.stats || { title: "Nos chiffres", subtitle: "", items: [] };
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({});
  const [confirmDel, setConfirmDel] = useState(null);
  const [title, setTitle] = useState(stats.title);
  const [subtitle, setSubtitle] = useState(stats.subtitle || "");

  const iconMap = {
    users: I.users, spark: I.spark, shield: I.shield, home: I.home, pin: I.pin,
    building: I.building, hammer: I.hammer, sofa: I.sofa, chair: I.chair,
    carpet: I.carpet, car: I.car, star: I.star, check: I.check, trend: I.trend,
  };

  const saveHeader = () => {
    setContent((c) => ({ ...c, stats: { ...(c.stats || {}), title, subtitle } }));
    onToast("Titre enregistré");
  };

  const openNew = () => { setDraft({ value: "", suffix: "", label: "", icon: "trend", active: true }); setEditing("new"); };
  const openEdit = (s) => { setDraft({ ...s }); setEditing(s.id); };

  const save = () => {
    if (!draft.label?.trim()) { onToast("Le libellé est obligatoire", "error"); return; }
    if (!draft.value?.toString().trim()) { onToast("La valeur est obligatoire", "error"); return; }
    setContent((c) => {
      const items = c.stats?.items || [];
      if (editing === "new") {
        const id = Math.max(0, ...items.map((s) => s.id)) + 1;
        return { ...c, stats: { ...c.stats, items: [...items, { ...draft, id, order: items.length + 1 }] } };
      }
      return { ...c, stats: { ...c.stats, items: items.map((s) => (s.id === editing ? { ...s, ...draft } : s)) } };
    });
    onToast(editing === "new" ? "Chiffre ajouté" : "Chiffre modifié");
    setEditing(null);
  };

  const remove = (id) => {
    setContent((c) => ({ ...c, stats: { ...c.stats, items: (c.stats?.items || []).filter((s) => s.id !== id) } }));
    onToast("Chiffre supprimé");
    setConfirmDel(null);
  };
  const toggle = (id) => setContent((c) => ({ ...c, stats: { ...c.stats, items: (c.stats?.items || []).map((s) => (s.id === id ? { ...s, active: !s.active } : s)) } }));
  const move = (id, dir) => setContent((c) => {
    const list = [...(c.stats?.items || [])].sort((a, b) => (a.order || 0) - (b.order || 0));
    const i = list.findIndex((s) => s.id === id);
    const j = i + dir;
    if (j < 0 || j >= list.length) return c;
    [list[i], list[j]] = [list[j], list[i]];
    return { ...c, stats: { ...c.stats, items: list.map((s, k) => ({ ...s, order: k + 1 })) } };
  });

  const items = (stats.items || []).sort((a, b) => (a.order || 0) - (b.order || 0));

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h1 className="text-[24px] font-extrabold text-slate-900">Statistiques</h1>
          <p className="text-[14px] text-slate-500 mt-1">Mettez à jour vos chiffres clés à chaque accomplissement. Ils s'animent automatiquement sur le site.</p>
        </div>
        <Btn variant="primary" icon={I.plus("w-4 h-4")} onClick={openNew}>Nouveau chiffre</Btn>
      </div>

      <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 p-6 space-y-4">
        <h2 className="text-[15px] font-bold text-slate-900">Titre de la section</h2>
        <div className="grid sm:grid-cols-2 gap-4">
          <TextField label="Titre" value={title} onChange={setTitle} placeholder="Ex : Nos chiffres" />
          <TextField label="Sous-titre" value={subtitle} onChange={setSubtitle} placeholder="Ex : Des résultats concrets." />
        </div>
        <Btn variant="primary" size="sm" icon={I.save("w-4 h-4")} onClick={saveHeader}>Enregistrer le titre</Btn>
      </div>

      {editing !== null && (
        <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 p-6">
          <h2 className="text-[16px] font-bold text-slate-900">{editing === "new" ? "Nouveau chiffre" : "Modifier le chiffre"}</h2>
          <div className="mt-5 grid sm:grid-cols-2 gap-4">
            <TextField label="Valeur (chiffre)" value={draft.value || ""} onChange={(v) => setDraft({ ...draft, value: v })} placeholder="Ex : 500, 3, 100" />
            <TextField label="Suffixe (optionnel)" value={draft.suffix || ""} onChange={(v) => setDraft({ ...draft, suffix: v })} placeholder="Ex : +, %, ans, /7" />
            <div className="sm:col-span-2">
              <TextField label="Libellé" value={draft.label || ""} onChange={(v) => setDraft({ ...draft, label: v })} placeholder="Ex : Clients satisfaits à Abidjan" />
            </div>
            <div>
              <label className="text-[12.5px] font-semibold text-slate-700 block mb-1.5">Icône</label>
              <select value={draft.icon} onChange={(e) => setDraft({ ...draft, icon: e.target.value })} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-[#1E9BE0] outline-none text-[14px] bg-white">
                {Object.keys(iconMap).map((k) => <option key={k} value={k}>{k}</option>)}
              </select>
            </div>
            <div className="flex items-end pb-2">
              <Toggle checked={draft.active !== false} onChange={(v) => setDraft({ ...draft, active: v })} label="Visible sur le site" />
            </div>
            <div className="sm:col-span-2 bg-slate-50 rounded-xl p-4">
              <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Aperçu</div>
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-[#1E9BE0]/10 text-[#1E9BE0] flex items-center justify-center">
                  {(iconMap[draft.icon] || I.trend)("w-6 h-6")}
                </div>
                <div>
                  <div className="text-[28px] font-extrabold text-slate-900 leading-none">{draft.value || "0"}{draft.suffix || ""}</div>
                  <div className="text-[13px] text-slate-600 mt-1">{draft.label || "Libellé"}</div>
                </div>
              </div>
            </div>
          </div>
          <div className="mt-6 flex gap-3">
            <Btn variant="primary" icon={I.save("w-4 h-4")} onClick={save}>Enregistrer</Btn>
            <Btn variant="ghost" onClick={() => setEditing(null)}>Annuler</Btn>
          </div>
        </div>
      )}

      {items.length === 0 && editing === null ? (
        <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 p-12 text-center">
          <div className="w-14 h-14 rounded-full bg-[#1E9BE0]/10 text-[#1E9BE0] flex items-center justify-center mx-auto">{I.trend("w-6 h-6")}</div>
          <p className="mt-4 text-[14px] font-semibold text-slate-700">Aucun chiffre pour le moment</p>
          <p className="mt-1 text-[13px] text-slate-500">Ajoutez vos chiffres clés (clients, années d'expérience, taux de satisfaction…).</p>
          <p className="mt-1 text-[12px] text-slate-400">Aucune donnée n'est inventée — vous seul décidez quoi afficher.</p>
          <Btn variant="primary" icon={I.plus("w-4 h-4")} onClick={openNew} className="mt-4">Ajouter mon premier chiffre</Btn>
        </div>
      ) : items.length > 0 && (
        <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 overflow-hidden">
          <div className="divide-y divide-slate-100">
            {items.map((s) => {
const iconFn = iconMap[s.icon] || I.trend;              return (
                <div key={s.id} className="px-5 py-4 flex items-center gap-4">
                  <div className="text-[#1E9BE0] shrink-0">
  {iconFn("w-6 h-6")}
</div>
                  <div className="min-w-0 flex-1">
                    <div className="flex items-baseline gap-2">
                      <span className="text-[20px] font-extrabold text-slate-900">{s.value}{s.suffix || ""}</span>
                      {!s.active && <span className="text-[10.5px] font-bold uppercase text-slate-400 bg-slate-100 px-2 py-0.5 rounded">Masqué</span>}
                    </div>
                    <div className="text-[13px] text-slate-500 truncate">{s.label}</div>
                  </div>
                  <div className="flex items-center gap-1 shrink-0">
                    <button onClick={() => move(s.id, -1)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Monter"><span style={{ transform: "rotate(90deg)", display: "inline-block" }}>{I.arrowL("w-4 h-4")}</span></button>
                    <button onClick={() => move(s.id, 1)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Descendre"><span style={{ transform: "rotate(90deg)", display: "inline-block" }}>{I.arrow("w-4 h-4")}</span></button>
                    <button onClick={() => toggle(s.id)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Activer/désactiver">{s.active !== false ? I.eye("w-4 h-4") : I.eye_off("w-4 h-4")}</button>
                    <button onClick={() => openEdit(s)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Modifier">{I.pencil("w-4 h-4")}</button>
                    <button onClick={() => setConfirmDel(s)} className="w-8 h-8 rounded-lg hover:bg-red-50 text-red-500 flex items-center justify-center" aria-label="Supprimer">{I.trash("w-4 h-4")}</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <Confirm open={!!confirmDel} title="Supprimer ce chiffre ?" message={`"${confirmDel?.label}" sera définitivement supprimé.`} onCancel={() => setConfirmDel(null)} onConfirm={() => remove(confirmDel.id)} />
    </div>
  );
}

    setContent((c) => ({ ...c, faq: { ...c.faq, ...header } }));

  };

  const openEdit = (f) => { setDraft({ ...f }); setEditing(f.id); };

  const save = () => {
    if (!draft.q?.trim()) { onToast("La question est obligatoire", "error"); return; }
    if (!draft.a?.trim()) { onToast("La réponse est obligatoire", "error"); return; }
    setContent((c) => {
      const items = c.faq?.items || [];
      if (editing === "new") {
        const id = Math.max(0, ...items.map((f) => f.id)) + 1;
        return { ...c, faq: { ...c.faq, items: [...items, { ...draft, id, order: items.length + 1 }] } };
      }
      return { ...c, faq: { ...c.faq, items: items.map((f) => (f.id === editing ? { ...f, ...draft } : f)) } };
    });
    onToast(editing === "new" ? "Question ajoutée" : "Question modifiée");
    setEditing(null);

    setContent((c) => ({ ...c, faq: { ...c.faq, items: (c.faq?.items || []).filter((f) => f.id !== id) } }));
    onToast("Question supprimée");
    setConfirmDel(null);

  const move = (id, dir) => setContent((c) => {

    return { ...c, faq: { ...c.faq, items: list.map((f, k) => ({ ...f, order: k + 1 })) } };

                </div>
                <div className="flex items-center gap-1 shrink-0">
                  <button onClick={() => move(f.id, -1)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Monter"><span style={{ transform: "rotate(90deg)", display: "inline-block" }}>{I.arrowL("w-4 h-4")}</span></button>
                  <button onClick={() => move(f.id, 1)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Descendre"><span style={{ transform: "rotate(90deg)", display: "inline-block" }}>{I.arrow("w-4 h-4")}</span></button>
                  <button onClick={() => toggle(f.id)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Activer/désactiver">{f.active !== false ? I.eye("w-4 h-4") : I.eye_off("w-4 h-4")}</button>
                  <button onClick={() => openEdit(f)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Modifier">{I.pencil("w-4 h-4")}</button>
                  <button onClick={() => setConfirmDel(f)} className="w-8 h-8 rounded-lg hover:bg-red-50 text-red-500 flex items-center justify-center" aria-label="Supprimer">{I.trash("w-4 h-4")}</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <Confirm open={!!confirmDel} title="Supprimer cette question ?" message={`"${confirmDel?.q}" sera définitivement supprimée.`} onCancel={() => setConfirmDel(null)} onConfirm={() => remove(confirmDel.id)} />
    </div>
  );
}

function AdminLegal({ content, setContent, onToast }) {
  const legal = content.legal || {};
  const [tab, setTab] = useState("company");
  const [draft, setDraft] = useState(legal);

  useEffect(() => { setDraft(legal); }, [legal]);

  const updateCompany = (k, v) => setDraft({ ...draft, company: { ...draft.company, [k]: v } });
  const updateMentions = (k, v) => setDraft({ ...draft, mentions: { ...draft.mentions, [k]: v } });
  const updatePrivacy = (k, v) => setDraft({ ...draft, privacy: { ...draft.privacy, [k]: v } });
  const updateSection = (which, i, k, v) => {
    const key = which === "mentions" ? "mentions" : "privacy";
    const arr = [...(draft[key]?.sections || [])];
    arr[i] = { ...arr[i], [k]: v };
    setDraft({ ...draft, [key]: { ...draft[key], sections: arr } });
  };

    const key = which === "mentions" ? "mentions" : "privacy";

    arr.push({ id, title: "Nouvelle section", body: "" });
    setDraft({ ...draft, [key]: { ...draft[key], sections: arr } });
  };
  const removeSection = (which, id) => {
    const key = which === "mentions" ? "mentions" : "privacy";

function AdminServices({ content, setContent, media, onToast }) {
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({});
  const [pickerFor, setPickerFor] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  const iconMap = { sofa: I.sofa, chair: I.chair, carpet: I.carpet, car: I.car, building: I.building, hammer: I.hammer };

  const openNew = () => { setDraft({ title: "", desc: "", price: "Sur devis", icon: "sofa", image: "", active: true }); setEditing("new"); };
  const openEdit = (s) => { setDraft({ ...s }); setEditing(s.id); };

  const save = () => {
    if (!draft.title?.trim()) { onToast("Le titre est obligatoire", "error"); return; }
    setContent((c) => {
      if (editing === "new") {
        const id = Math.max(0, ...c.services.map((s) => s.id)) + 1;
        return { ...c, services: [...c.services, { ...draft, id, order: c.services.length + 1 }] };
      }
      return { ...c, services: c.services.map((s) => (s.id === editing ? { ...s, ...draft } : s)) };
    });
    onToast(editing === "new" ? "Service ajouté" : "Service modifié");
    setEditing(null);
  };

  const remove = (id) => { setContent((c) => ({ ...c, services: c.services.filter((s) => s.id !== id) })); onToast("Service supprimé"); setConfirmDel(null); };
  const toggle = (id) => setContent((c) => ({ ...c, services: c.services.map((s) => (s.id === id ? { ...s, active: !s.active } : s)) }));
  const move = (id, dir) => setContent((c) => {
    const list = [...c.services].sort((a, b) => a.order - b.order);
    const i = list.findIndex((s) => s.id === id);
    const j = i + dir;
    if (j < 0 || j >= list.length) return c;
    [list[i], list[j]] = [list[j], list[i]];
    return { ...c, services: list.map((s, k) => ({ ...s, order: k + 1 })) };
  });

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between gap-4">
        <div>
          <h1 className="text-[24px] font-extrabold text-slate-900">Services</h1>
          <p className="text-[14px] text-slate-500 mt-1">Créez, modifiez, activez et réordonnez vos prestations.</p>
        </div>
        <Btn variant="primary" icon={I.plus("w-4 h-4")} onClick={openNew}>Nouveau service</Btn>
      </div>

      {editing !== null && (
        <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 p-6">
          <h2 className="text-[16px] font-bold text-slate-900">{editing === "new" ? "Nouveau service" : "Modifier le service"}</h2>
          <div className="mt-5 grid sm:grid-cols-2 gap-5">
            <div className="sm:col-span-2">
              <ImageField label="Image du service" value={draft.image} onChange={(v) => setDraft({ ...draft, image: v })} hint="JPG, PNG — compressée automatiquement" onOpenLibrary={() => setPickerFor("service")} aspect="aspect-[16/10]" />
            </div>
            <TextField label="Titre" value={draft.title || ""} onChange={(v) => setDraft({ ...draft, title: v })} placeholder="Ex : Nettoyage de canapés" />
            <TextField label="Prix affiché" value={draft.price || ""} onChange={(v) => setDraft({ ...draft, price: v })} placeholder="Ex : À partir de 15 000 F CFA" />
            <div className="sm:col-span-2">
              <TextField label="Description courte" value={draft.desc || ""} onChange={(v) => setDraft({ ...draft, desc: v })} placeholder="Ex : Nettoyage en profondeur des tissus." />
            </div>
            <div>
              <label className="text-[12.5px] font-semibold text-slate-700 block mb-1.5">Icône</label>
              <select value={draft.icon} onChange={(e) => setDraft({ ...draft, icon: e.target.value })} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-[#1E9BE0] outline-none text-[14px] bg-white">
                {Object.keys(iconMap).map((k) => <option key={k} value={k}>{k}</option>)}
              </select>
            </div>
            <div className="flex items-end pb-2">
              <Toggle checked={draft.active} onChange={(v) => setDraft({ ...draft, active: v })} label="Service actif (visible sur le site)" />
            </div>
          </div>
          <div className="mt-6 flex gap-3">
            <Btn variant="primary" icon={I.save("w-4 h-4")} onClick={save}>Enregistrer</Btn>
            <Btn variant="ghost" onClick={() => setEditing(null)}>Annuler</Btn>
          </div>
        </div>
      )}

      <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 overflow-hidden">
        <div className="divide-y divide-slate-100">
          {[...content.services].sort((a, b) => a.order - b.order).map((s) => {
            const iconFn = iconMap[s.icon] || I.spark;
            return (
              <div key={s.id} className="px-5 py-4 flex items-center gap-4">
                <div className="w-14 h-14 rounded-xl overflow-hidden shrink-0 ring-1 ring-slate-900/5">
                  <Img src={s.image} alt={s.title} className="w-full h-full object-cover" />
                </div>
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2">
                    <span className="text-[14.5px] font-semibold text-slate-900 truncate">{s.title}</span>
                    {!s.active && <span className="text-[10.5px] font-bold uppercase text-slate-400 bg-slate-100 px-2 py-0.5 rounded">Inactif</span>}
                  </div>
                  <div className="text-[13px] text-slate-500 truncate">{s.desc} · <span className="font-semibold text-[#0A2A6B]">{s.price}</span></div>
                </div>
                <div className="flex items-center gap-1 shrink-0">
                  <button onClick={() => move(s.id, -1)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Monter"><span style={{transform: "rotate(90deg)", display: "inline-block"}}>{I.arrowL("w-4 h-4")}</span></button>
                  <button onClick={() => move(s.id, 1)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Descendre"><span style={{transform: "rotate(90deg)", display: "inline-block"}}>{I.arrow("w-4 h-4")}</span></button>
                  <button onClick={() => toggle(s.id)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Activer/désactiver">{s.active ? I.eye("w-4 h-4") : I.eye_off("w-4 h-4")}</button>
                  <button onClick={() => openEdit(s)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center" aria-label="Modifier">{I.pencil("w-4 h-4")}</button>
                  <button onClick={() => setConfirmDel(s)} className="w-8 h-8 rounded-lg hover:bg-red-50 text-red-500 flex items-center justify-center" aria-label="Supprimer">{I.trash("w-4 h-4")}</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <MediaPicker open={pickerFor !== null} onClose={() => setPickerFor(null)} media={media} onPick={(url) => setDraft({ ...draft, image: url })} />
      <Confirm open={!!confirmDel} title="Supprimer le service ?" message={`"${confirmDel?.title}" sera définitivement supprimé.`} onCancel={() => setConfirmDel(null)} onConfirm={() => remove(confirmDel.id)} />
    </div>
  );
}

/* ============================================================

============================================================ */
function AdminBeforeAfter({ content, setContent, media, onToast }) {
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({});
  const [pickerFor, setPickerFor] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  const openNew = () => { setDraft({ title: "", desc: "", before: "", after: "", active: true }); setEditing("new"); };
  const openEdit = (b) => { setDraft({ ...b }); setEditing(b.id); };

  const save = () => {
    if (!draft.title?.trim()) { onToast("Le titre est obligatoire", "error"); return; }
    if (!draft.before || !draft.after) { onToast("Ajoutez les images AVANT et APRÈS", "error"); return; }
    setContent((c) => {
      if (editing === "new") {
        const id = Math.max(0, ...c.beforeAfter.map((b) => b.id)) + 1;
        return { ...c, beforeAfter: [...c.beforeAfter, { ...draft, id }] };
      }
      return { ...c, beforeAfter: c.beforeAfter.map((b) => (b.id === editing ? { ...b, ...draft } : b)) };
    });
    onToast(editing === "new" ? "Transformation ajoutée" : "Transformation modifiée");
    setEditing(null);
  };

  const remove = (id) => { setContent((c) => ({ ...c, beforeAfter: c.beforeAfter.filter((b) => b.id !== id) })); onToast("Transformation supprimée"); setConfirmDel(null); };
  const toggle = (id) => setContent((c) => ({ ...c, beforeAfter: c.beforeAfter.map((b) => (b.id === id ? { ...b, active: !b.active } : b)) }));

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between gap-4">
        <div>
          <h1 className="text-[24px] font-extrabold text-slate-900">Avant / Après</h1>

============================================================ */
function AdminTestimonials({ content, setContent, media, onToast }) {
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({});
  const [pickerFor, setPickerFor] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  const openNew = () => { setDraft({ name: "", text: "", photo: "", rating: 5, active: true }); setEditing("new"); };
  const openEdit = (t) => { setDraft({ ...t }); setEditing(t.id); };

  const save = () => {
    if (!draft.name?.trim()) { onToast("Le prénom est obligatoire", "error"); return; }
    if (!draft.text?.trim()) { onToast("Le texte de l'avis est obligatoire", "error"); return; }
    setContent((c) => {
      if (editing === "new") {
        const id = Math.max(0, ...c.testimonials.map((t) => t.id)) + 1;
        return { ...c, testimonials: [...c.testimonials, { ...draft, id }] };
      }
      return { ...c, testimonials: c.testimonials.map((t) => (t.id === editing ? { ...t, ...draft } : t)) };
    });
    onToast(editing === "new" ? "Témoignage ajouté" : "Témoignage modifié");
    setEditing(null);
  };

  const remove = (id) => { setContent((c) => ({ ...c, testimonials: c.testimonials.filter((t) => t.id !== id) })); onToast("Témoignage supprimé"); setConfirmDel(null); };
  const toggle = (id) => setContent((c) => ({ ...c, testimonials: c.testimonials.map((t) => (t.id === id ? { ...t, active: t.active === false } : t)) }));

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between gap-4">
        <div>
          <h1 className="text-[24px] font-extrabold text-slate-900">Témoignages</h1>
          <p className="text-[14px] text-slate-500 mt-1">Ajoutez et gérez les avis de vos clients.</p>

      {editing !== null && (
        <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 p-6">

          <div className="mt-5 grid sm:grid-cols-2 gap-5">
            <ImageField label="Photo du client" value={draft.photo} onChange={(v) => setDraft({ ...draft, photo: v })} onOpenLibrary={() => setPickerFor("photo")} hint="Optionnel" />
            <div className="space-y-4">
              <TextField label="Prénom" value={draft.name || ""} onChange={(v) => setDraft({ ...draft, name: v })} placeholder="Ex : Aïcha K." />
              <div>
                <label className="text-[12.5px] font-semibold text-slate-700 block mb-1.5">Note</label>
                <div className="flex gap-1">
                  {[1, 2, 3, 4, 5].map((n) => (
                    <button key={n} type="button" onClick={() => setDraft({ ...draft, rating: n })} className={`w-9 h-9 rounded-lg flex items-center justify-center transition-colors ${n <= (draft.rating || 5) ? "text-[#F59E0B]" : "text-slate-300"}`}>
                      {I.star("w-5 h-5")}
                    </button>
                  ))}
                </div>
              </div>
            </div>
            <div className="sm:col-span-2"><TextArea label="Texte de l'avis" value={draft.text || ""} onChange={(v) => setDraft({ ...draft, text: v })} placeholder="Ex : Mon canapé est comme neuf ! Service rapide et professionnel." rows={3} /></div>
            <div className="sm:col-span-2"><Toggle checked={draft.active !== false} onChange={(v) => setDraft({ ...draft, active: v })} label="Publié sur le site" /></div>
          </div>
          <div className="mt-6 flex gap-3">
            <Btn variant="primary" icon={I.save("w-4 h-4")} onClick={save}>Enregistrer</Btn>
            <Btn variant="ghost" onClick={() => setEditing(null)}>Annuler</Btn>
          </div>
        </div>
      )}

      {content.testimonials.length === 0 ? (
        <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 p-12 text-center">

  );

function AdminZones({ content, setContent, onToast }) {
  const [editing, setEditing] = useState(null);
  const [draftName, setDraftName] = useState("");
  const [confirmDel, setConfirmDel] = useState(null);

  const save = () => {
    if (!draftName.trim()) { onToast("Le nom est obligatoire", "error"); return; }
    setContent((c) => {
      if (editing === "new") {
        const id = Math.max(0, ...c.zones.map((z) => z.id)) + 1;
        return { ...c, zones: [...c.zones, { id, name: draftName.trim(), active: true }] };
      }
      return { ...c, zones: c.zones.map((z) => (z.id === editing ? { ...z, name: draftName.trim() } : z)) };
    });
    onToast(editing === "new" ? "Zone ajoutée" : "Zone modifiée");
    setEditing(null); setDraftName("");
  };

  const remove = (id) => { setContent((c) => ({ ...c, zones: c.zones.filter((z) => z.id !== id) })); onToast("Zone supprimée"); setConfirmDel(null); };
  const toggle = (id) => setContent((c) => ({ ...c, zones: c.zones.map((z) => (z.id === id ? { ...z, active: !z.active } : z)) }));

  return (
    <div className="space-y-6">

        <div>
          <h1 className="text-[24px] font-extrabold text-slate-900">Zones d'intervention</h1>

            <Btn variant="primary" icon={I.save("w-4 h-4")} onClick={save}>Enregistrer</Btn>
            <Btn variant="ghost" onClick={() => { setEditing(null); setDraftName(""); }}>Annuler</Btn>
          </div>
        </div>
      )}

      <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 overflow-hidden">

          {content.zones.map((z) => (
            <div key={z.id} className="px-5 py-4 flex items-center gap-4">

              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2">
                  <span className="text-[14.5px] font-semibold text-slate-900">{z.name}</span>
                  {!z.active && <span className="text-[10.5px] font-bold uppercase text-slate-400 bg-slate-100 px-2 py-0.5 rounded">Inactif</span>}
                </div>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={() => toggle(z.id)} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center">{z.active ? I.eye("w-4 h-4") : I.eye_off("w-4 h-4")}</button>
                <button onClick={() => { setDraftName(z.name); setEditing(z.id); }} className="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center">{I.pencil("w-4 h-4")}</button>
                <button onClick={() => setConfirmDel(z)} className="w-8 h-8 rounded-lg hover:bg-red-50 text-red-500 flex items-center justify-center">{I.trash("w-4 h-4")}</button>
              </div>
            </div>
          ))}
        </div>
      </div>

      <Confirm open={!!confirmDel} title="Supprimer cette zone ?" message={`"${confirmDel?.name}" sera définitivement supprimée.`} onCancel={() => setConfirmDel(null)} onConfirm={() => remove(confirmDel.id)} />
    </div>
  );
}

/* ============================================================
   ADMIN MÉDIATHÈQUE
============================================================ */
function AdminMedia({ media, setMedia, onToast }) {
  const [search, setSearch] = useState("");
  const [uploading, setUploading] = useState(false);
  const inputRef = useRef(null);

  const filtered = media.filter((m) => m.name.toLowerCase().includes(search.toLowerCase()));

  const handleFiles = async (files) => {
    if (!files || files.length === 0) return;
    setUploading(true);
    const newItems = [];
    for (const file of Array.from(files)) {
      if (!file.type.startsWith("image/")) continue;
      try {
        const dataUrl = await compressImage(file);
        newItems.push({ id: Date.now() + Math.random(), name: file.name, dataUrl, size: dataUrlSize(dataUrl), date: new Date().toISOString() });
      } catch (e) { console.error(e); }
    }
    if (newItems.length > 0) {
      setMedia((m) => [...m, ...newItems]);
      onToast(`${newItems.length} image${newItems.length > 1 ? "s" : ""} ajoutée${newItems.length > 1 ? "s" : ""}`);
    }
    setUploading(false);
  };

  const remove = (id) => { setMedia((m) => m.filter((x) => x.id !== id)); onToast("Image supprimée"); };

  const totalSize = media.reduce((s, m) => s + (m.size || 0), 0);
  const limit = 4.5 * 1024 * 1024;
  const usage = Math.min(100, Math.round((totalSize / limit) * 100));

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h1 className="text-[24px] font-extrabold text-slate-900">Médiathèque</h1>
          <p className="text-[14px] text-slate-500 mt-1">Téléversez et gérez toutes vos images. Elles sont compressées automatiquement.</p>
        </div>
        <Btn variant="primary" icon={I.upload("w-4 h-4")} onClick={() => inputRef.current?.click()}>Téléverser</Btn>
        <input ref={inputRef} type="file" accept="image/*" multiple className="hidden" onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />
      </div>

      <div onDragOver={(e) => { e.preventDefault(); }} onDrop={(e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); }}
        className="bg-white rounded-2xl ring-1 ring-slate-900/5 border-2 border-dashed border-slate-200 hover:border-[#1E9BE0] transition-colors p-8 text-center cursor-pointer"
        onClick={() => inputRef.current?.click()}>
        <div className="w-14 h-14 rounded-2xl bg-[#1E9BE0]/10 text-[#1E9BE0] flex items-center justify-center mx-auto">
          {uploading ? <div className="w-6 h-6 border-2 border-[#1E9BE0] border-t-transparent rounded-full spin" /> : I.upload("w-6 h-6")}
        </div>
        <p className="mt-4 text-[14px] font-semibold text-slate-700">{uploading ? "Traitement..." : "Glissez vos images ici, ou cliquez pour parcourir"}</p>
        <p className="mt-1 text-[12.5px] text-slate-500">Plusieurs fichiers acceptés · JPG, PNG, WebP · Compression automatique</p>
      </div>

      <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 p-4 flex flex-col sm:flex-row items-stretch sm:items-center gap-4">
        <div className="flex-1">
          <div className="flex items-center justify-between text-[12.5px] text-slate-600 mb-1.5">
            <span>Espace utilisé</span>
            <span className="font-semibold">{formatSize(totalSize)} / ~4,5 Mo</span>
          </div>
          <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
            <div className={`h-full transition-all ${usage > 85 ? "bg-red-500" : usage > 60 ? "bg-[#F59E0B]" : "bg-[#5CC63D]"}`} style={{ width: `${usage}%` }} />
          </div>
        </div>
        <div className="relative sm:w-64">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">{I.search("w-4 h-4")}</span>
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Rechercher..." className="w-full pl-9 pr-3 py-2 rounded-xl bg-slate-50 border border-transparent focus:border-slate-200 focus:bg-white outline-none text-[13.5px]" />
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 p-12 text-center">
          <div className="w-14 h-14 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto">{I.image("w-6 h-6")}</div>
          <p className="mt-4 text-[14px] font-semibold text-slate-700">{media.length === 0 ? "Aucune image pour le moment" : "Aucun résultat"}</p>
          <p className="mt-1 text-[13px] text-slate-500">{media.length === 0 ? "Téléversez vos premières images." : "Essayez un autre terme de recherche."}</p>
        </div>
      ) : (
        <div className="bg-white rounded-2xl ring-1 ring-slate-900/5 p-5">
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
            {filtered.map((m) => (
              <div key={m.id} className="group relative aspect-square rounded-xl overflow-hidden ring-1 ring-slate-900/5 bg-slate-50">
                <img src={m.dataUrl} alt={m.name} className="w-full h-full object-cover" />
                <div className="absolute inset-0 bg-slate-900/0 group-hover:bg-slate-900/60 transition-colors flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100">
                  <button onClick={() => window.open(m.dataUrl, "_blank")} className="w-9 h-9 rounded-lg bg-white/95 text-slate-700 flex items-center justify-center hover:bg-white transition-colors" aria-label="Voir" title="Aperçu">{I.eye("w-4 h-4")}</button>
                  <button onClick={() => { navigator.clipboard.writeText(m.name); onToast("Nom copié", "info"); }} className="w-9 h-9 rounded-lg bg-white/95 text-slate-700 flex items-center justify-center hover:bg-white transition-colors" aria-label="Copier le nom" title="Copier le nom">{I.file("w-4 h-4")}</button>
                  <button onClick={() => remove(m.id)} className="w-9 h-9 rounded-lg bg-white/95 text-red-500 flex items-center justify-center hover:bg-white transition-colors" aria-label="Supprimer" title="Supprimer">{I.trash("w-4 h-4")}</button>
                </div>
                <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-slate-900/80 to-transparent p-2 opacity-0 group-hover:opacity-100 transition-opacity">
                  <p className="text-[11px] font-semibold text-white truncate">{m.name}</p>
                  <p className="text-[10px] text-white/70">{formatSize(m.size || 0)}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function App() {

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        return {
          ...DEFAULT_CONTENT,
          ...parsed,
          brand: { ...DEFAULT_CONTENT.brand, ...(parsed.brand || {}) },
          hero: {
  ...DEFAULT_CONTENT.hero,
  ...(parsed.hero || {}),
  typewriter: { ...DEFAULT_CONTENT.hero.typewriter, ...(parsed.hero?.typewriter || {}) },
  phrases: (parsed.hero?.phrases && parsed.hero.phrases.length >= 10)
    ? parsed.hero.phrases
    : DEFAULT_CONTENT.hero.phrases,
},
          cta: { ...DEFAULT_CONTENT.cta, ...(parsed.cta || {}) },
                    contact: { ...DEFAULT_CONTENT.contact, ...(parsed.contact || {}) },
          stats: { ...DEFAULT_CONTENT.stats, ...(parsed.stats || {}) },
                    social: { ...DEFAULT_CONTENT.social, ...(parsed.social || {}) },
          parentCompany: { ...DEFAULT_CONTENT.parentCompany, ...(parsed.parentCompany || {}) },
        };
      }
    } catch (e) { console.error(e); }
    return DEFAULT_CONTENT;
  });
  const [media, setMedia] = useState(() => {
    try {
      const saved = localStorage.getItem(MEDIA_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) { console.error(e); }
    return [];
  });
  const [requests, setRequests] = useState(() => {
  try {
    const saved = localStorage.getItem(REQUESTS_KEY);
    if (saved) return JSON.parse(saved);
  } catch (e) { console.error(e); }
  return [];
});
  const [saveWarning, setSaveWarning] = useState(false);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(content)); }
    catch (e) { console.error("localStorage plein :", e); setSaveWarning(true); }
  }, [content]);

  useEffect(() => {
    try { localStorage.setItem(MEDIA_KEY, JSON.stringify(media)); }
    catch (e) { console.error("localStorage plein (média) :", e); setSaveWarning(true); }
  }, [media]);

  useEffect(() => {
  try { localStorage.setItem(REQUESTS_KEY, JSON.stringify(requests)); }
  catch (e) { console.error("localStorage plein (demandes) :", e); }
}, [requests]);

const addRequest = (req) => setRequests((r) => [req, ...r]);
  useEffect(() => {
    if (sessionStorage.getItem("ece_admin") === "1") setAdmin({ email: "admin" });
  }, []);

  useEffect(() => { window.scrollTo(0, 0); }, [view]);

  const handleLogout = () => {
    sessionStorage.removeItem("ece_admin");
    setAdmin(null);
    setView("site");
  };

  if (view === "login") return <AdminLogin content={content} onLogin={(a) => { setAdmin(a); setView("admin"); }} onBack={() => setView("site")} />;
if (view === "mentions" || view === "privacy") return <LegalPage content={content} type={view} onBack={(target) => { if (target === "mentions" || target === "privacy") setView(target); else setView("site"); }} />;
if (view === "admin" && admin) return (
  <>
    <AdminShell content={content} setContent={setContent} media={media} setMedia={setMedia} requests={requests} setRequests={setRequests} onLogout={handleLogout} onBack={() => setView("site")} />
      {saveWarning && (
        <div className="fixed bottom-6 right-6 z-[90] bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-4 py-3 text-[13px] max-w-xs shadow-lg">
          <p className="font-semibold">Espace de stockage presque plein</p>
          <p className="mt-1 text-[12px]">Supprimez quelques images de la médiathèque pour libérer de l'espace.</p>
          <button onClick={() => setSaveWarning(false)} className="mt-2 text-[12px] font-semibold underline">Fermer</button>
        </div>
      )}
    </>
  );

  return (
  <>
    <Landing
  content={content}
  onAdmin={() => setView("login")}
  onNewRequest={addRequest}
  onNavigate={(target) => setView(target || "site")}
/>

    {/* Bouton Appeler flottant — desktop uniquement (mobile a la barre fixe) */}
    <a
      href={`tel:${content.contact.phone.replace(/\s/g, "")}`}
      title={`Appeler ${content.contact.phone}`}
      className="hidden lg:flex fixed bottom-5 left-5 z-40 w-12 h-12 rounded-full bg-[#5CC63D] hover:bg-[#4CAF50] text-white shadow-lg items-center justify-center transition-colors"
      aria-label="Appeler"
    >
      {I.phone("w-5 h-5")}
    </a>

    {/* Cadenas admin — desktop uniquement */}
    <button
      onClick={() => setView("login")}
      title="Espace administrateur"
      className="hidden lg:flex fixed bottom-5 right-5 z-40 w-12 h-12 rounded-full bg-[#071B2C] text-white/80 hover:text-white shadow-lg items-center justify-center transition-colors"
      aria-label="Administration"
    >
      {I.lock("w-5 h-5")}
    </button>
  </>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
